<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bewerbungstracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle-button">Dunkelmodus</button>
  <main class="container">
    <h1>Bewerbungstracker</h1>

    <div class="add-application">
      <h2>Füge neue Bewerbung hinzu:</h2>
      <p id="message" role="status" aria-live="polite"></p>
      <form id="add-form">
        <label for="company">Unternehmen:</label>
        <input type="text" id="company" name="company" required><br><br>

        <label for="position">Position:</label>
        <input type="text" id="position" name="position" required><br><br>

        <label for="date">Bewerbungsdatum:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="status">Status:</label>
        <select id="status" name="status">
          <option value="Applied">Beworben</option>
          <option value="Interviewing">Vorstellungsgespräch</option>
          <option value="Offer">Angebot</option>
          <option value="Rejected">Absage</option>
        </select><br><br>

        <label for="description-link">Link zur Stellenanzeige:</label>
        <input type="url" id="description-link" name="description-link"><br><br>

        <button type="submit">Hinzufügen</button>
        <button type="button" id="cancel-edit" hidden>Abbrechen</button>
      </form>
    </div>

    <div class="application-list">
      <h2>Meine Bewerbungen</h2>
      <table id="application-table">
        <thead>
          <tr>
            <th>Unternehmen</th>
            <th>Position</th>
            <th>Bewerbungsdatum</th>
            <th>Status</th>
            <th>Stellenanzeige</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p class="animated-copyright">&copy; <span id="current-year"></span> Michael Koch</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
